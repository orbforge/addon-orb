name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mqtt-shell:
    name: MQTT shell behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check shell syntax
        run: |
          dash -n docker/mqtt.sh
          dash -n docker/mqtt-summary.sh
          dash -n tests/mqtt-summary-test.sh

      - name: Run MQTT summary tests
        run: dash tests/mqtt-summary-test.sh
